<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relationship Tags Prototype</title>
<!-- Prototype, 16 Oct: the relationship tags research/sims-display.md proposes (§6 option B: six groups, game wording where it
     exists, plus a free label and a dynamic), next to options A (game labels only) and C (free text), and the Spouse vs
     Husband / Wife wording. Opens straight from the folder. Reads the app's files in site/ and changes nothing. -->
<base href="../../../site/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="../for-jemma/prototypes/sims/proto.css">
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Open worlds menu" type="button"><span id="menuIco"></span>Worlds</button><b>Jemma's Sim World</b></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Worlds">
  <a class="brand" href="#home"><b>Jemma's <em>Sim World</em></b><small>Every world, rebuilt</small></a>
  <div class="search"><span class="search-ico" id="searchIco"></span><input id="q" type="search" placeholder="Search…" aria-label="Search the site" autocomplete="off" spellcheck="false"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><div class="wrap" id="view"></div></main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="../for-jemma/prototypes/sims/proto-icons.js"></script>
<script src="../for-jemma/prototypes/sims/proto.js"></script>
<script>
protoStart({page: "tags.html", title: "Relationship tags"});
function onSeg(name, v) { if (name === "words") { OLD_WORDS = v === "old"; draw(); } }
// with "Husband / Wife" chosen, romance tags read the older way
const shownName = t => OLD_WORDS && TAGS[t].old ? TAGS[t].old.join(" / ") : TAGS[t].name;
const pill = (t, cls = "") => `<span class="tg ${TAGS[t].g} ${cls}">${ic(GROUPS[TAGS[t].g].icon)}${esc(shownName(t))}</span>`;
const nm = id => esc(SIMS[id].name.split(" ")[0]);

// real examples where the data has them (the game, EA's Gallery households, or the site now)
const EXAMPLES = {
  family:   [`${nm("agnes-crumplebottom")} ↔ ${nm("mortimer-goth")}: <b>Aunt</b> (worked out: she is his late mother’s sister)`],
  romance:  [`${nm("mortimer-goth")} ↔ ${nm("bella-goth")}: ${pill("spouse")}`, `Agnes ↔ Robert: ${pill("ex")} · Agnes ↔ Erik: ${pill("late-spouse")}`, `Don ↔ Katrina: ${pill("crush")} <span class="lbl">Romantic interest</span>`],
  friends:  [`Bjorn Bjergsen ↔ Jacques Villareal: ${pill("friends")}`, `Celeste Capp ↔ Dante Monty: ${pill("good-friends")} <span class="lbl">Cousins</span>`],
  conflict: [`Tybalt Capp ↔ Juliette Monty: ${pill("enemies")} <span class="lbl">They despise each other</span>`],
  work:     [`Clara Bjergsen ↔ Mila Munch: ${pill("coworkers")}`, `Mortimer, Bella ↔ Bob, Eliza: ${pill("classmates")} <span class="lbl">Copperdale Class of ’00</span>`, `Elderberry ↔ Pleasant: ${pill("landlord")} <span class="src" style="display:inline-flex">${ic("info")}on the site now (Spring Steppes)</span>`],
  dynasty:  [`Landgraab ↔ Abrantes: ${pill("ally")}`, `Capp ↔ Monty: ${pill("dyn-rival")}`, `Johnny Zest: ${pill("outcast")} of the Landgraabs`],
};
const WORKED_OUT = ["Parent", "Child", "Sibling", "Grandparent", "Grandchild", "Aunt or uncle", "Niece or nephew", "Cousin", "In-law", "Step- and half-", "Great-grand…", "Ancestor", "Descendant"];
const NOTES = {
  family: "Never typed: worked out from each Sim’s parents and partners, as the game does since patch 193.",
  romance: "Game words since patch 162. Crush is ours (the game has many romance labels; one word is enough).",
  friends: "The game’s friendship labels. Store the label, never the bar.",
  conflict: "Rivals and Enemies (the game only has Disliked and Despised).",
  work: "Coworkers is the game’s; Classmates, Boss and Landlord / Tenant are ours.",
  dynasty: "Royalty & Legacy’s alliances, rivalries and outcasts.",
};

function page() {
  let h = protoBar("Relationship tags", "Options shown: 6B six groups with game wording (suggested), plus a free label and a dynamic; 6A game labels only and 6C free text for comparison; and the Spouse vs Husband / Wife wording.",
    seg("words", "Words", [["game", "Spouse"], ["old", "Husband / Wife"]], OLD_WORDS ? "old" : "game"));
  h += `<section class="hero small" style="--c:#8E62CF"><div class="kicker"><i></i><span class="label">How links are named</span></div><h1 style="margin-top:14px">Relationship <em>tags</em></h1>
    <p>A fixed list in six groups. Each group has its own colour, Lucide icon and line style, so colour is never the only clue.</p></section>`;
  h += `<div class="opt-head"><span class="no">6B</span><h2>Six groups</h2><span class="rec">Suggested</span></div>
    <div class="tag-groups">${Object.entries(GROUPS).map(([g, G]) => `<div class="tag-group" style="--g:var(--t-${g})">
      <h3><span class="ico">${ic(G.icon)}</span>${G.name}</h3>
      <div class="tagrow" style="display:flex;flex-wrap:wrap;gap:6px">${g === "family" ? WORKED_OUT.map(w => `<span class="tg family plain">${esc(w)}</span>`).join("") : Object.keys(TAGS).filter(t => TAGS[t].g === g).map(t => pill(t)).join("")}</div>
      <p>${esc(NOTES[g])}</p>
      <div class="line-eg"><svg viewBox="0 0 120 16" aria-hidden="true">${edge(4, 8, 116, 8, g)}</svg>on drawings</div>
      ${EXAMPLES[g].map(e => `<div class="eg-line">${e}</div>`).join("")}</div>`).join("")}</div>`;
  // extras: free label, dynamic, and an idea
  h += `<div class="opt-head"><span class="no">+</span><h2>A label and a dynamic, if wanted</h2></div>
    <p class="say">Any link can carry a short free <b>label</b> (like the game’s custom relationships), and an optional <b>dynamic</b> word from the game (family: Close, Distant, Difficult, Jokesters; romantic: Steamy, Strained, Unpredictable, Wholesome). Ideas that aren’t in the game get a dashed pill.</p>
    <div class="rel-list" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      ${relCard("h-willow-creek--pancakes", [LINKS.find(l => l.b === "h-willow-creek--pancakes" && l.a === "h-willow-creek--goth")])}
      <div class="rel-card" style="--w:${wColour(worldById("tartosa"))};--g:var(--t-romance)"><span class="mono">M</span><b>Monty</b><span class="where">Rifugio dei Pirati · Tartosa (not owned)</span>
        <span class="tagrow">${pill("spouse")}<span class="lbl">Ran away together</span><span class="dyn">Wholesome</span></span><span class="who">Romeo ↔ Juliette</span><span class="src">${ic("info")}How a label and a dynamic read <span class="eg">example</span></span></div>
      ${relCard("h-ondarion--enzo-alto", [LINKS.find(l => l.a === "h-willow-creek--goth" && l.b === "h-ondarion--enzo-alto")])}
    </div>`;
  // the wording choice
  const rows = ["spouse", "engaged", "partner", "ex", "late-spouse"];
  h += `<div class="opt-head"><span class="no">4</span><h2>Spouse, or Husband and Wife?</h2></div>
    <p class="say">Since patch 162 the game says Spouse, Engaged and Partner. The Goth cards on the site say Husband and Wife now. The Words switch at the top (here and on the household page) shows both.</p>
    <div class="pair even"><div class="pane"><div class="label"><b>The game’s words</b></div><div class="sheet-wrap" style="margin:0"><table class="sheet words"><tbody>${rows.map(t => `<tr><td>${esc(TAGS[t].name === "Ex" ? "Ex-Spouse" : TAGS[t].name)}</td></tr>`).join("")}</tbody></table></div>
        <p class="say" style="margin:12px 0 0">Bella’s card: <b>Mortimer Goth</b> Spouse</p></div>
      <div class="pane"><div class="label"><b>Husband / Wife</b></div><div class="sheet-wrap" style="margin:0"><table class="sheet words"><tbody>${rows.map(t => `<tr><td>${esc(TAGS[t].old.join(" / "))}</td></tr>`).join("")}</tbody></table></div>
        <p class="say" style="margin:12px 0 0">Bella’s card: <b>Mortimer Goth</b> Husband</p></div></div>`;
  // the alternatives
  const GAME = ["Spouse", "Engaged", "Partner", "Ex-Spouse", "Late Spouse", "Best Friends Forever", "Good Friends", "Friends", "Acquaintances", "Disliked", "Despised", "Coworkers", "Neighbours", "Roommates"];
  const FREE = ["childhood sweethearts", "Mortimer’s old classmate", "can’t stand each other", "landlady", "best mates", "secret admirer"];
  h += `<div class="opt-head"><span class="no">6</span><h2>The other two options</h2><span class="rec alt">For comparison</span></div>
    <div class="pair even">
      <div class="pane"><div class="label"><span class="no">A</span><b>The game’s labels only</b></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${GAME.map(w => `<span class="tg plain">${esc(w)}</span>`).join("")}</div>
        <div class="verdict"><span>Matches the game exactly</span><span class="minus">Can’t say Rivals, Classmates, Landlord or anything about dynasties</span><span class="minus">No groups, so no colours or line styles</span></div></div>
      <div class="pane"><div class="label"><span class="no">C</span><b>Free text</b></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${FREE.map(w => `<span class="tg plain free">${esc(w)}</span>`).join("")}</div>
        <div class="verdict"><span>Say anything</span><span class="minus">Can’t group, colour or count links (two people type “best mates” and “BFFs”)</span></div></div></div>
    <div class="note" style="margin-top:28px">To decide: keep the six groups? Add or drop any tag (Classmates, Boss, Landlord / Tenant, Crush, Enemies are ours, not the game’s)?</div>`;
  h += `<footer><span>Prototype only: nothing on the site has changed. Examples are EA’s (Sims Wiki), EA’s Gallery households, or the site now; one is marked as an example.</span><span>Icons by Lucide</span></footer>`;
  return h;
}
function draw() { const y = scrollY; document.getElementById("view").innerHTML = page(); window.scrollTo(0, y); }
draw();
</script>
</body>
</html>
