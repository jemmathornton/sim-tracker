<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goth Household Prototype</title>
<!-- Prototype, 16 Oct (slimmed 17 Oct): the Goth household page as the family overview, with her 17 Oct decisions: each Sim
     has their own page (sim.html); family portrait first, roster underneath (roster first when there's no portrait); plain
     links to their lots, no picture of the house; a short dynasty line only; the household's family tree from family links
     only; relationships only on Sim pages; origin "Premade" or "Mine". Opens straight from the folder. Reads the app's own
     files in site/ and changes nothing. -->
<base href="../../../site/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="../for-jemma/prototypes/sims/proto.css">
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Open worlds menu" type="button"><span id="menuIco"></span>Worlds</button><b>Jemma's Sim World</b></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Worlds">
  <a class="brand" href="#home"><b>Jemma's <em>Sim World</em></b><small>Every world, rebuilt</small></a>
  <div class="search"><span class="search-ico" id="searchIco"></span><input id="q" type="search" placeholder="Search…" aria-label="Search the site" autocomplete="off" spellcheck="false"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><div class="wrap" id="view"></div></main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="../for-jemma/prototypes/sims/proto-icons.js"></script>
<script src="../for-jemma/prototypes/sims/proto.js"></script>
<script>
{ // a block, so this page's names stay out of the app's global scope
protoStart({page: "household.html", title: "Goth household", world: "willow-creek", hh: "h-willow-creek--goth"});
const HH = hhIndex["h-willow-creek--goth"];
const isNew = (t = "new") => `<span class="eg">${t}</span>`;
const simName = id => P_SIM_PAGES.includes(id) ? `<a href="${pSimHref(id)}">${esc(P_SIMS[id].name)}</a>` : `<b>${esc(P_SIMS[id].name)}</b>`;

// a household's family portrait (her screenshot). The Goths have none yet, so a stand-in shows where it goes.
const PORTRAITS = {
  "h-willow-creek--goth": {lot: "l-willow-creek--bargain-bend", find: /dining/i, standIn: "Stand-in picture (your Willow’s dining room): a Goth household screenshot would go here"},
};
function portrait(hhId, ids) {
  const p = PORTRAITS[hhId]; if (!p) return "";   // no portrait yet: the roster comes first, with no empty frame
  const pic = lotIndex[p.lot].photos.find(x => p.find.test(x.caption)) || {};
  if (!pic.src) return "";
  return `<div class="portrait" style="background-image:url('${pic.src}')">${p.standIn ? `<span class="cap">${esc(p.standIn)}</span>` : ""}
    <div class="names">${ids.map(id => { const first = `<b>${esc(P_SIMS[id].name.split(" ")[0])}</b>`;
      return `<div>${P_SIM_PAGES.includes(id) ? `<a href="${pSimHref(id)}">${first}</a>` : first}<small>${esc(P_SIMS[id].age)}</small></div>`; }).join("")}</div></div>`;
}

function roster(ids, profiles) {
  return `<div class="sheet-wrap"><table class="sheet roster"><thead><tr><th scope="col">Sim</th><th scope="col">Life stage</th><th scope="col">Life state</th><th scope="col">Aspiration</th><th scope="col">Career or school</th><th scope="col">Details</th></tr></thead><tbody>
    ${ids.map(id => { const s = P_SIMS[id], has = profiles && s.traits;
      return `<tr><td><span class="who"><span class="mono">${initial(s.name)}</span>${simName(id)}</span></td>
        <td>${esc(s.age)}</td><td>${s.state ? `<span class="state occult">${ic("ghost")}${esc(s.state)}</span>` : `<span class="muted">Human</span>`}</td>
        <td>${s.aspiration ? esc(s.aspiration) : `<span class="muted">—</span>`}</td><td>${esc(s.career || s.school || "") || `<span class="muted">—</span>`}</td>
        <td><span class="lvl ${has ? "profile" : ""}">${has ? "Profile" : "Basics"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
}

// plain-link lines for where they live and what they own, run, rent and let (from the app's own data)
function lotLines(hh) {
  const link = l => `<a href="#${l.id}">${esc(l.name)}</a>`, hhLinkA = x => `<a href="#${x.id}">${esc(x.name)}</a>`;
  const homes = hh.lots.filter(l => !l.owned), owns = hh.lots.filter(l => l.owned);
  const lets = homes.concat(owns).filter(l => l.hh === hh && l.tenants && l.tenants.length).flatMap(l => l.tenants);
  const rows = [[homes.length > 1 ? "Homes" : "Home", homes.map(link).join(", ")],
    [owns.length ? "Owns or runs" : "", owns.map(l => `${link(l)} (${esc(l.type)})`).join(", ")],
    [hh.tenantOf ? "Rents from" : "", hh.tenantOf && hh.tenantOf.hh ? `${hhLinkA(hh.tenantOf.hh)} (${link(hh.tenantOf)})` : ""],
    [lets.length ? "Rents to" : "", lets.map(hhLinkA).join(", ")]];
  return rows.filter(([t, v]) => t && v).map(([t, v]) => `<div><dt>${t}</dt><dd>${v}</dd></div>`).join("");
}
// the dynasty line: the dynasties the household's Sims belong to (usually one), each linking to its page
const dynLine = ids => [...new Set(ids.map(id => (pDynastyOf(id) || [])[0]).filter(Boolean))].map(gid => `<a href="${pGroupHref(gid)}">${ic("crown")}${esc(P_SIM_GROUPS[gid].name)}</a>`).join(", ");

function page() {
  const w = HH.world, home1 = HH.lots[0], hc = home1.hood.color, ids = pMembersOf(HH.id), hoods = [...new Set(HH.lots.map(l => l.hood))];
  const neighbours = Object.values(w.households).filter(x => x !== HH && x.lots.some(l => l.hood === home1.hood));
  const dyn = dynLine(ids), tree = pTreeOf(HH.id);
  let h = protoBar("Goth household", "The family overview (17 Oct). Her decisions, 17 Oct: each name opens the Sim’s own page; family portrait first, roster underneath (roster first when there’s no portrait); plain links to their lots, no picture of the house; just a dynasty line (clubs and organisations are on Sim pages); the household’s family tree from family links only; relationships only on Sim pages; origin Premade or Mine. Also shown: 4B basics only, at the bottom.", "", "17 Oct");
  h += `<section class="hero small" style="--c:${home1.hood.glow || hc}"><div class="crumbs"><a href="#w-${w.id}">${ic("map")}${esc(w.name)}</a><a href="#n-${home1.hood.id}">${ic("pin")}${esc(home1.hood.name)}</a>${HH.lots.map(l => `<a href="#${l.id}">${ic(l.owned ? "pin" : "home")}${esc(l.name)}</a>`).join("")}</div>
    <div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:22px"><div class="monogram">${initial(HH.name)}</div><div><span class="label" style="color:var(--on-deep-mute)">Household</span><h1 style="margin-top:6px">${esc(HH.name)}</h1></div></div></section>
    <div class="detail" style="--h:${hc}">
      <div><dl class="facts"><div><dt>World</dt><dd><a href="#w-${w.id}">${esc(w.name)}</a></dd></div><div><dt>Neighbourhood</dt><dd>${esc(hoods.map(x => x.name).join(", "))}</dd></div>
        ${lotLines(HH)}
        <div><dt>Sims made in game</dt><dd>Not yet</dd></div></dl></div>
      <div><dl class="facts"><div><dt>Origin ${isNew()}</dt><dd>${pOriginTag(P_HH_ORIGIN[HH.id])}</dd></div>
        <div><dt>Played ${isNew()}</dt><dd>Not yet</dd></div>
        <div><dt>Neighbourhood Stories ${isNew()}</dt><dd>Not noted yet</dd></div>
        ${dyn ? `<div><dt>Dynasty ${isNew()}</dt><dd class="dynline">${dyn}</dd></div>` : ""}</dl></div>
    </div>`;
  // The Sims: family portrait first when there is one, then the roster; each name opens the Sim's page
  h += `<section class="block" style="--h:${hc}"><div class="block-head"><h2>The <em>Sims</em></h2><span class="count">${ids.length} Sims · no pets</span></div>
    ${portrait(HH.id, ids)}
    ${roster(ids, true)}
    <p class="pets">${ic("paw-print")}No pets. Cats, dogs and horses would be listed here (name, species, life stage).</p>
    <p class="source">Each name opens the Sim’s own page. Skill levels are left out: they change every time you play.</p></section>`;
  // the household's family tree (none when nobody here has family anywhere)
  if (tree.length) h += `<section class="block" style="--h:${hc}"><div class="block-head"><h2>Family <em>tree</em></h2>${isNew()}<a class="count" href="${PROTO}family-tree.html">Open it on its own page</a></div>
    <p class="say">Everyone who lives here (highlighted), all their blood relatives and those relatives’ partners, wherever they live. Built from family links only, never from who lives together. Names open the Sim pages.</p>
    <div class="tree-box">${pDrawTree(tree, {line: "goth", compact: true, cw: 146, ch: 96, labels: false, here: HH.id})}</div>${pTreeKey(true, pWColour(w))}</section>`;
  h += `<section class="block" style="--h:${hc}"><div class="block-head"><h2>Their <em>story</em></h2></div><div class="empty">${ic("note")}No story yet: yours to write.</div></section>`;
  h += neighbours.length ? `<section class="block"><div class="block-head"><h2>Neighbours</h2></div><div class="families">${neighbours.map(x => famCard(x)).join("")}</div></section>` : "";
  // a household with basics only, and no portrait yet
  const P = hhIndex["h-willow-creek--pancakes"];
  h += `<div class="opt-head"><span class="no">4B</span><h2>The same block with basics only</h2></div>
    <p class="say">The Pancakes (${esc(P.lots[0].name)}, ${esc(P.lots[0].hood.name)}) as they’d look with just the basics and no portrait yet: the roster comes first, with no empty frame. Most households would start like this.</p>
    <section class="block" style="--h:${P.lots[0].hood.color};margin-top:18px"><div class="block-head"><h2>The <em>Sims</em></h2><span class="count">2 Sims · no pets</span></div>
    ${portrait(P.id, pMembersOf(P.id))}${roster(pMembersOf(P.id), false)}
    <div class="empty" style="margin-top:14px">${ic("sim")}No profiles yet. Their Sim pages would show the basics until traits, an aspiration and a career are noted.</div></section>`;
  h += `<footer><span>Prototype only: nothing on the site has changed. Sim details from The Sims Wiki.</span><span>Icons by Lucide</span></footer>`;
  return h;
}
const v = document.getElementById("view"); v.innerHTML = page(); lazyPics(v);
}
</script>
</body>
</html>
