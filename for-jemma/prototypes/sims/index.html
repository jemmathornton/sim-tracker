</aside>

<script src="js/icons.js"></script>

<script src="../for-jemma/prototypes/sims/proto-icons.js"></script>
<script src="../for-jemma/prototypes/sims/proto.js"></script>
<script>
protoStart({page: "index.html", title: "Sims prototypes"});
const ITEMS = [
  ["household.html", "users", "Household page", "The Goths’ page: a roster table and Sim cards, a mini family tree, and connected households grouped by tag. Switch between roster first and a family portrait.", "5B · 5C · 7a-A · 7d-A · 8A · 8C · 4B"],
  ["family-tree.html", "network", "Family tree", "The Goth line drawn top-down next to a plain generations list. Cornelia’s chip opens the Crumplebottoms. The Capps and Montys across Ondarion and Tartosa, drawn both ways.", "7a-A · 7a-B · 7b-A · 7c-A · 7c-B · 7c-C"],
  ["relationships.html", "link", "Links between households", "Grouped lists next to a small web around one household (Goth, Landgraab, Enzo Alto, Capp or Thebe), lines on the Willow Creek map, and the eight dynasties as a diagram and a grid.", "7d-A · 7d-B · 7d-C · 7d-D"],
  ["tags.html", "tag", "Relationship tags", "The six tag groups with their colours, icons and line styles; a free label and a dynamic; Spouse or Husband and Wife; the other two options.", "6A · 6B · 6C · decision 4"],
];
const ASKS = [
  ["Household page", "a roster first (5B) or a family portrait at the top (5C)? Origin and “In the game / In my save” on EA’s Sims (8A, 8C)? Does the basics-only version (4B) look enough for most households?"],
  ["Family tree", "start with the drawn tree (A) or the generations list (B)? Families that move: one tree across worlds (7c-A) or a tree per world with “moved” stubs (7c-B)?"],
  ["Links", "grouped lists first, then the small web around one household? Is the map version worth having?"],
  ["Tags", "the six groups, plus a free label? Add or drop any tag? The game’s “Spouse” or “Husband / Wife”?"],
];
let h = protoBar("Contents", "Prototypes for research/sims-display.md (overnight 16–17 Oct). Option letters match that file.");
h += `<section class="hero small" style="--c:#8E62CF"><div class="kicker"><i></i><span class="label">Prototypes · 16 Oct</span></div><h1 style="margin-top:14px">Showing <em>Sims</em></h1>
  <p>How households, family trees and relationships could look, drawn with the site’s own styles. Nothing here changes the site.</p></section>`;
h += `<div class="contents">${ITEMS.map(([f, i, t, d, o]) => `<a href="${PROTO}${f}"><span class="ico">${ic(i)}</span><b>${t}</b><em>${o}</em><span>${d}</span></a>`).join("")}</div>`;
h += `<div class="opt-head"><h2>What each page asks you</h2></div><ul class="asks">${ASKS.map(([p, q]) => `<li><b>${p}:</b> ${q}</li>`).join("")}</ul>`;
h += `<div class="opt-head"><h2>Where things come from</h2></div><ul class="asks">
  <li><b>Sims:</b> EA’s starting versions from The Sims Wiki (the Goths, Crumplebottoms, Pancakes, Capps and Montys), checked against tonight’s research/ea-family-lore.md. Nothing is from your save yet, so every “In my save” line is empty.</li>
  <li><b>Links:</b> the game (family, Royalty & Legacy dynasties), EA’s <i>Copperdale Class of ’00</i> Gallery household (Mortimer, Bella, the Pancakes and the Landgraabs as teens), your plan (Romeo, Juliette and Dante in Tartosa; Enzo’s family), and ideas, shown with dashed pills.</li>
  <li><b>Households, homes, colours and maps:</b> the site’s own data. No pictures of Sims: monograms, plus one of your screenshots as a stand-in on the household page. Maps by 20th Century Plumbob, icons by Lucide.</li>
  <li><b>Opening them:</b> double-click any page in this folder. Fonts load from Google Fonts like the app does; without internet they fall back to similar ones. Household and lot links open the real app.</li></ul>`;
h += `<footer><span>Prototype only: nothing on the site has changed.</span><span>Icons by Lucide</span></footer>`;
document.getElementById("view").innerHTML = h;
</script>
