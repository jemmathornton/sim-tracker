<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree Prototype</title>
<!-- Prototype, 16 Oct (redone 17 Oct to her decisions): the drawn top-down tree (7a-A), one per household. Everyone who lives
     there is highlighted; all their blood relatives and those relatives' partners are drawn too, wherever they live, as
     lighter boxes with a world chip. Family links only; worlds don't matter. The Goths, and the Capps as a second example.
     Opens straight from the folder. Reads the app's files in site/ and changes nothing. -->
<base href="../../../site/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="../for-jemma/prototypes/sims/proto.css">
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Open worlds menu" type="button"><span id="menuIco"></span>Worlds</button><b>Jemma's Sim World</b></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Worlds">
  <a class="brand" href="#home"><b>Jemma's <em>Sim World</em></b><small>Every world, rebuilt</small></a>
  <div class="search"><span class="search-ico" id="searchIco"></span><input id="q" type="search" placeholder="Search…" aria-label="Search the site" autocomplete="off" spellcheck="false"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><div class="wrap" id="view"></div></main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="../for-jemma/prototypes/sims/proto-icons.js"></script>
<script src="../for-jemma/prototypes/sims/proto.js"></script>
<script>
{ // a block, so this page's names stay out of the app's global scope
protoStart({page: "family-tree.html", title: "Family tree", world: "willow-creek"});
const WC = pWorldById("willow-creek");

// one household's tree, as it would sit on the household page
function hhTree(hhId, line, title, link) {
  const hh = hhIndex[hhId], ids = pTreeOf(hhId), here = ids.filter(id => P_SIMS[id].hh === hhId).length, c = hh.lots[0].hood.color;
  return `<section class="block" style="--h:${c}"><div class="block-head"><h2>${title}</h2><span class="count">${esc(hh.world.name)} · ${here} live here, ${ids.length - here} elsewhere or late</span></div>
    <p class="say" style="margin-bottom:12px">${link}</p>
    <div class="tree-box">${pDrawTree(ids, {line, here: hhId, compact: true, cw: 146, ch: 124, labels: false})}</div></section>`;
}

function page() {
  let h = protoBar("Family tree", "Her decisions, 17 Oct: the drawn top-down tree (7a-A), one per household. Everyone who lives there (highlighted), all their blood relatives and those relatives’ partners, wherever they live (lighter, with a chip for where). Built from family links only. Worlds don’t matter: no per-world trees, no “moved” stubs. A household where nobody has family anywhere gets no tree.", "", "17 Oct");
  h += `<section class="hero small" style="--c:${WC.color}"><div class="kicker"><i></i><span class="label">One per household</span></div><h1 style="margin-top:14px">Family <em>trees</em></h1>
    <p>Each household page has its own tree, centred on the Sims who live there. Married-in Sims carry a chip for the family they were born into.</p></section>`;
  h += hhTree("h-willow-creek--goth", "goth", "The <em>Goths</em>", `The four at Ophelia Villa, Mortimer’s late mother Cornelia and her family, and Agnes Crumplebottom in Henford-on-Bagley with her ex-spouse and late spouse. Names open the <a href="${PROTO}household.html">Goths’</a> Sim pages.`);
  h += hhTree("h-ondarion--capp", "capp", "The <em>Capps</em>", "The four at Bellacorde Palace. Tybalt’s sister Juliette, her spouse Romeo and their son Dante live in Tartosa in your plan; Consort Capp is a ghost with no home in Ondarion.");
  h += pTreeKey(true);
  h += `<footer><span>Prototype only: nothing on the site has changed. Family links from The Sims Wiki; Tartosa is your plan.</span><span>Icons by Lucide</span></footer>`;
  return h;
}
document.getElementById("view").innerHTML = page();
}
</script>
</body>
</html>
