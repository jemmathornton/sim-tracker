<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relationships Prototype</title>
<!-- Prototype, 16 Oct (redone 17 Oct to her decision): relationships are between Sims, so they live only on Sim pages.
     The two ways to show them there, centred on one Sim: A grouped lists, B a small web around the Sim
     (research/sims-display.md §7d). Opens straight from the folder. Reads the app's files in site/ and changes nothing. -->
<base href="../../../site/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="../for-jemma/prototypes/sims/proto.css">
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="Open worlds menu" type="button"><span id="menuIco"></span>Worlds</button><b>Jemma's Sim World</b></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Worlds">
  <a class="brand" href="#home"><b>Jemma's <em>Sim World</em></b><small>Every world, rebuilt</small></a>
  <div class="search"><span class="search-ico" id="searchIco"></span><input id="q" type="search" placeholder="Search…" aria-label="Search the site" autocomplete="off" spellcheck="false"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><div class="wrap" id="view"></div></main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="../for-jemma/prototypes/sims/proto-icons.js"></script>
<script src="../for-jemma/prototypes/sims/proto.js"></script>
<script>
{ // a block, so this page's names stay out of the app's global scope
protoStart({page: "relationships.html", title: "Relationships", world: "willow-creek"});
const CENTRES = ["bella-goth", "mortimer-goth", "tybalt-capp", "juliette-monty", "celeste-capp"];
let CENTRE = new URLSearchParams(location.search).get("c");
if (!CENTRES.includes(CENTRE)) CENTRE = "bella-goth";
window.onSeg = function (name, v) { if (name === "centre") { CENTRE = v; drawAB(); } }
const rec = t => `<span class="rec" style="font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--done);border:1.5px solid color-mix(in srgb,var(--done) 50%,var(--line));padding:2px 7px;border-radius:99px">${t}</span>`;

function drawAB() {
  const s = P_SIMS[CENTRE], nm = s.name.split(" ")[0];
  document.getElementById("ab").innerHTML = `
    <div class="pane"><div class="label"><span class="no">A</span><b>Grouped lists</b>${rec("To start")}</div>
      <p class="say" style="margin-top:0">${esc(nm)}’s close family and everyone ${esc(nm)} has a link with, one group per tag. Each card opens the other Sim’s page, or their household.</p>
      <div class="ab-list">${pSimRelGroups(CENTRE, {family: true})}</div>
      <div class="verdict"><span>Readable, and fine with very few links</span><span class="minus">No picture of the whole web</span></div></div>
    <div class="pane"><div class="label"><span class="no">B</span><b>${esc(nm)} in the middle</b>${rec("Next")}</div>
      <p class="say" style="margin-top:0">A small drawing on the same page: lines styled by tag group, each Sim’s tags under their name, and a key.</p>
      ${pDrawSimWeb(CENTRE, 820, 600)}${pWebKey(["family", "romance", "friends", "conflict", "work"])}
      <div class="verdict"><span>Never messy: only this Sim’s links</span><span class="minus">One Sim at a time</span></div></div>`;
}

function page() {
  let h = protoBar("Relationships", "Her decision, 17 Oct: relationships are between Sims, so they live only on Sim pages, grouped by tag (none on household pages). The two ways to show them, centred on one Sim (pick above): 7d-A grouped lists and 7d-B a small web. Family words are worked out from parents and partners.",
    pSeg("centre", "Sim", CENTRES.map(id => [id, P_SIMS[id].name.split(" ")[0]]), CENTRE), "17 Oct");
  h += `<section class="hero small" style="--c:${pWorldById("willow-creek").color}"><div class="kicker"><i></i><span class="label">On each Sim’s page</span></div><h1 style="margin-top:14px">Who <em>knows</em> whom</h1>
    <p>The Goths have only family so far; Tybalt, Juliette and Celeste show friends, coworkers and enemies across Ondarion and Tartosa.</p></section>`;
  h += `<div class="opt-head"><span class="no">7d</span><h2>On a Sim’s page</h2></div><div class="ab-stack" id="ab"></div>`;
  h += `<footer><span>Prototype only: nothing on the site has changed. Relationships from The Sims Wiki; Tartosa is your plan.</span><span>Icons by Lucide</span></footer>`;
  return h;
}
document.getElementById("view").innerHTML = page();
drawAB();
}
</script>
</body>
</html>
