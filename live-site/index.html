<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jemma's Sim World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Concept: an interiors-magazine / property-listing site for a Sims save. Deep world colour for the sidebar and hero, elegant serif display,
   lots presented as listings with a photo area (lot plan until screenshots exist). Icons: Lucide (ISC). No illustrations. */
:root{
  --paper:#F1F2EE; --surface:#FFFFFF; --ink:#1A1F1C; --muted:#5F6862; --line:#DFE3DD; --soft:#E8EBE6;
  --nav:#2A1D40; --deep:#2A1D40; --deep-2:#3D2A5C; --on-deep:#F1F4F7; --on-deep-mute:color-mix(in srgb,#fff 64%,var(--deep));
  --brass:#C9A04A; --done:#2E8B57;
  --display:"Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --side:280px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101412; --surface:#181D1A; --ink:#E9EEEA; --muted:#A3AEA7; --line:#29312D; --soft:#202723; --done:#5CC48A; color-scheme:dark }}
:root[data-theme="dark"]{ --paper:#101412; --surface:#181D1A; --ink:#E9EEEA; --muted:#A3AEA7; --line:#29312D; --soft:#202723; --done:#5CC48A; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
em{font-style:italic}
.label{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- sidebar (deep) ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--nav);--deep:var(--nav);color:var(--on-deep);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.brand{display:block;padding:28px 24px 22px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{font:400 30px/1 var(--display);display:block}
.brand b em{color:var(--brass)}
.brand small{display:block;margin-top:8px;color:var(--on-deep-mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.nav{overflow-y:auto;padding:14px 12px 28px;flex:1;display:grid;gap:18px;align-content:start;scrollbar-color:rgba(255,255,255,.2) transparent}
.nav-group{display:grid;gap:1px}
.nav-group .label{padding:6px 12px 8px;color:var(--on-deep-mute)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;text-decoration:none;font-size:14.5px;font-weight:600}
.nav a:not(.soon):hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.12)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.nav .pct{margin-left:auto;font-size:12px;color:var(--on-deep-mute);font-variant-numeric:tabular-nums}
.nav a.soon{color:rgba(234,242,236,.45);font-weight:500;cursor:default}
.nav a.soon .dot{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.nav a.soon .pct{color:rgba(234,242,236,.35)}
.subnav{display:grid;margin:4px 0 8px 16px;padding-left:12px;border-left:1px solid rgba(255,255,255,.14)}
.subnav button{all:unset;cursor:pointer;padding:5px 10px;font-size:13.5px;color:var(--on-deep-mute);border-radius:6px}
.subnav button:hover{color:#fff;background:rgba(255,255,255,.07)}
.subnav button:focus-visible{outline:2px solid var(--brass)}
.topbar,.scrim{display:none}

/* ---------- main ---------- */
main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:1140px;margin:0 auto;padding-inline:clamp(16px,4vw,56px);padding-block:0 110px}

/* hero */
.hero{margin-inline:calc(-1 * clamp(16px,4vw,56px));padding:72px clamp(16px,4vw,56px) 46px;color:var(--on-deep);position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--c) 75%,#fff 8%) 0%,transparent 55%),linear-gradient(160deg,var(--deep-2),var(--deep) 70%)}
.hero::before{content:"";position:absolute;right:-60px;top:-30px;width:520px;height:520px;opacity:.16;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);background-size:26px 26px;
  mask-image:radial-gradient(closest-side,#000 30%,transparent);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);transform:rotate(-8deg)}
.hero>*{position:relative}
.kicker{display:flex;align-items:center;gap:10px;color:var(--on-deep-mute)}
.kicker .label{color:var(--on-deep-mute)}
.kicker i{width:28px;height:1px;background:var(--brass)}
.hero h1{font-size:clamp(64px,10vw,132px);line-height:.88;margin-top:18px;letter-spacing:-.02em}
.hero h1 em{color:var(--brass)}
.hero p{margin:22px 0 0;font-size:18px;max-width:56ch;color:color-mix(in srgb,var(--on-deep) 88%,transparent)}
.hero-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14)}
.figures{display:flex;flex-wrap:wrap;gap:12px 40px}
.figures div{display:grid}
.figures b{font:400 44px/1 var(--display);font-variant-numeric:tabular-nums}
.figures span{font-size:12.5px;color:var(--on-deep-mute);font-weight:600}
.chapters{display:flex;flex-wrap:wrap;gap:8px;max-width:520px;justify-content:flex-end}
.chapters button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.22);display:inline-flex;align-items:center;gap:7px}
.chapters button i{width:7px;height:7px;border-radius:50%;background:var(--h)}
.chapters button:hover{background:rgba(255,255,255,.1)}
.chapters button:focus-visible{outline:2px solid var(--brass)}

/* hero with a world map photo */
.hero.mapped{min-height:min(76vh,720px);display:flex;flex-direction:column;justify-content:flex-end;padding-top:120px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 5%,transparent) 0%,color-mix(in srgb,var(--deep) 25%,transparent) 40%,color-mix(in srgb,var(--deep) 86%,transparent) 78%,var(--deep) 100%),var(--map) center 35%/cover}
.hero.mapped::before{display:none}
.hero.mapped h1{text-shadow:0 4px 30px rgba(0,0,0,.35)}
.credit{position:absolute;right:clamp(16px,4vw,56px);top:18px;font-size:11.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.wt .photo.pic{background:var(--map) center/cover}
.wt .photo.pic .big{display:none}

/* neighbourhood */
.hood{margin-top:80px;scroll-margin-top:24px}
.hood-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end;margin-bottom:26px}
.hood-head .label{color:var(--h);grid-column:1/-1;display:flex;align-items:center;gap:10px}
.hood-head .label::before{content:"";width:22px;height:2px;background:var(--h)}
.hood-head h2{font-size:clamp(40px,5vw,58px);line-height:1}
.hood-head p{margin:10px 0 0;color:var(--muted);max-width:56ch;font-size:16px}
.hood-head .count{font:400 22px var(--display);font-style:italic;color:var(--muted);white-space:nowrap}
.listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
.listing{display:grid;gap:12px;text-decoration:none}
.photo{aspect-ratio:4/3;max-width:100%;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(90% 80% at 20% 15%,color-mix(in srgb,var(--h) 55%,#fff) 0%,transparent 60%),linear-gradient(145deg,color-mix(in srgb,var(--h) 80%,#000 5%),color-mix(in srgb,var(--h) 55%,#000 35%))}
.photo .plot-svg{width:62%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.listing:hover .plot-svg{transform:scale(1.06) rotate(-1.5deg)}
.photo .type{position:absolute;left:12px;top:12px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.92);color:#1A1F1C;letter-spacing:.02em}
.photo .status{position:absolute;right:12px;bottom:10px;display:flex;gap:5px}
.photo .status span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);color:rgba(255,255,255,.55);font-size:13px;backdrop-filter:blur(4px)}
.photo .status span.yes{background:#fff;color:var(--done)}
.photo .size{position:absolute;left:12px;bottom:10px;color:#fff;font:400 20px var(--display);font-style:italic;opacity:.92}
.listing h3{font-size:27px;line-height:1.05}
.listing .alias{font-style:italic;font-family:var(--display);font-size:18px;color:var(--muted);margin-top:-6px}
.listing .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.listing .meta span{display:inline-flex;align-items:center;gap:6px}
.listing .meta b{color:var(--ink);font-weight:700}
.listing:hover h3{text-decoration:underline;text-decoration-color:var(--h);text-decoration-thickness:1px;text-underline-offset:5px}

/* plot diagram (white line drawing on the colour) */
.plot-svg .frame{fill:none;stroke:rgba(255,255,255,.35);stroke-dasharray:2 4}
.plot-svg .ground{fill:rgba(255,255,255,.16);stroke:#fff;stroke-width:1.6}
.plot-svg line{stroke:rgba(255,255,255,.28);stroke-width:.6}
.plot-svg text{fill:rgba(255,255,255,.85);font:600 11px var(--body)}

/* progress panel */
.ledger{margin-top:96px;border-radius:22px;padding:34px clamp(20px,4vw,40px);background:var(--deep);color:var(--on-deep);display:grid;gap:26px}
.ledger h2{font-size:40px}
.ledger h2 em{color:var(--brass)}
.ledger-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.meter{display:grid;gap:10px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.meter b{font:400 52px/1 var(--display);font-variant-numeric:tabular-nums}
.meter span{font-size:13px;color:var(--on-deep-mute);font-weight:600;display:flex;align-items:center;gap:8px}
.meter .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brass)}

/* home */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:72px 0 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.section-head h2{font-size:44px;line-height:1}
.section-head .count{font:400 20px var(--display);font-style:italic;color:var(--muted)}
.wt{display:grid;gap:10px;text-decoration:none}
.wt .photo{--h:var(--c);aspect-ratio:16/10}
.wt .photo .big{font:400 54px/1 var(--display);color:#fff;opacity:.9;font-style:italic}
.wt h3{font-size:26px;line-height:1.05}
.wt .meta{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.wt.off .photo{filter:saturate(.55) brightness(.92)}
.wt.off.notown .photo{filter:grayscale(1);opacity:.5}
.wt.off .photo::after{content:"Coming soon";position:absolute;right:12px;bottom:10px;color:#fff;font:400 18px var(--display);font-style:italic;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.wt.off.notown .photo::after{content:"Not owned"}
.wt.off h3{color:var(--muted)}
a.wt:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--c)}

/* detail pages */
.hero.small{padding-top:56px;padding-bottom:40px}
.hero.small h1{font-size:clamp(52px,8vw,100px)}
.hero .alias{font-family:var(--display);font-style:italic;font-size:26px;color:var(--brass);margin-top:8px;display:block}
.crumbs{display:flex;flex-wrap:wrap;gap:8px}
.crumbs a,.crumbs span{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.22);font-weight:600;font-size:13px;text-decoration:none}
.crumbs a:hover{background:rgba(255,255,255,.1)}
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:36px;align-items:start}
.detail .photo{aspect-ratio:1/1}
.detail .photo .plot-svg{width:84%}
.facts{display:grid;margin:0;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:700;text-align:right}
.facts a{text-decoration-color:var(--h);text-underline-offset:4px}
.ticks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.tick{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.tick i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.tick.yes i{background:var(--done);border-color:var(--done)}
.tick.yes i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tick.na{opacity:.45}
.block{margin-top:64px}
.block-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.block-head h2{font-size:38px;line-height:1}
.empty{margin-top:18px;border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed color-mix(in srgb,var(--h) 45%,var(--line));display:grid;justify-items:center;gap:10px}
.empty svg{font-size:26px;color:var(--h)}
.bcard{grid-column:span 2}.bcard .photo{aspect-ratio:auto;height:190px}.bcard .units{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}.bcard .units a{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:var(--surface)}.bcard .units a:hover{border-color:var(--h)}.bcard .unit-no{font:400 22px var(--display);color:var(--h)}.bcard .unit-who{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}.bcard .unit-who i{color:var(--muted)}.bcard .units .status{position:static;display:flex;gap:6px}.bcard .units .status span{opacity:.3;display:flex}.bcard .units .status span.yes{opacity:1;color:var(--done)}
@media (max-width:640px){.bcard{grid-column:auto}}
.subnav .bld-label{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;color:var(--on-deep-mute)}.subnav .bld-label.path{color:var(--on-deep)}.subnav .bld-label svg{width:13px;height:13px}
.bgroup{grid-column:1/-1;padding:18px 18px 22px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--h,#888) 5%,var(--surface))}.bgroup-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bgroup-head h3{margin:0;font:400 26px var(--display)}.bgroup-head span{color:var(--muted);font-size:14px}.bgroup-head svg{color:var(--h);align-self:center}
.apt-art{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.55)}.apt-art svg{width:42px;height:42px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:20px}
.mini a{display:grid;gap:8px;text-decoration:none}
.mini .photo{aspect-ratio:16/10}
.mini .photo .plot-svg{width:46%}
.mini b{font:400 22px/1.1 var(--display)}
.mini small{color:var(--muted);font-size:13px;margin-top:-4px}
.note{margin-top:22px;padding:14px 18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--brass) 50%,var(--line));background:color-mix(in srgb,var(--brass) 10%,var(--surface));font-weight:600;font-size:14.5px}
.monogram{width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font:400 54px var(--display);font-style:italic;color:var(--brass);flex:none}
footer{margin-top:90px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* households */
.families{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.hood .families{margin-top:0}
.fam{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s ease,transform .2s ease}
.fam:hover{border-color:color-mix(in srgb,var(--h) 60%,var(--line));transform:translateY(-2px)}
.fam .mono{width:46px;height:46px;border-radius:50%;background:var(--h);color:#fff;display:grid;place-items:center;font:400 26px var(--display);font-style:italic;flex:none}
.fam b{font:400 22px/1.1 var(--display);display:block}
.fam small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.fam small.unsure{display:inline;color:var(--brass);font-weight:700}
.home-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:12px}
.hero.small p{margin-top:14px}
a.count{text-decoration:none}a.count:hover{color:var(--ink)}
.subnav .sublabel,.subnav .sublabel-link{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--on-deep-mute);padding:8px 10px 4px;opacity:.8}
.subnav .sublabel-link{text-decoration:none;display:block}.subnav .sublabel-link:hover{color:#fff}
.subnav button i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--h);margin-right:8px;vertical-align:middle}
.subnav a:not(.sublabel-link){padding:4px 10px;font-size:13.5px;color:var(--on-deep-mute);border-radius:6px;font-weight:500;text-decoration:none}
.subnav a.cur,.subnav a:not(.sublabel-link):hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-group.dim{opacity:.55}
.subnav button{padding:4px 10px!important;font-size:13.5px!important;font-weight:500;color:var(--on-deep-mute)!important}
.subnav button:hover,.subnav button.cur{color:#fff!important;background:rgba(255,255,255,.08)}
.lotnav{display:grid;margin:0 0 4px 12px;padding-left:8px;border-left:1px solid rgba(255,255,255,.1)}
.subnav .lotnav a{font-size:13px;padding:3px 10px}

/* household listing cards */
.photo .initial{font:400 96px/1 var(--display);font-style:italic;color:#fff;opacity:.92;text-shadow:0 4px 24px rgba(0,0,0,.18)}
.photo .flag{width:auto!important;padding:0 10px;border-radius:99px!important;background:rgba(255,255,255,.9)!important;color:#1A1F1C!important;font-size:11.5px!important;font-weight:700}
.listing:hover .initial{transform:scale(1.05);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.hh-hero.mapped{min-height:min(56vh,520px)}

/* neighbourhood cards */
.mosaic{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;width:82%;max-height:72%;overflow:hidden}
.mosaic span{width:40px;height:40px;display:grid}
.mosaic .plot-svg{width:100%!important;height:auto}
.listing .desc{margin:-4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.chip-link{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:rgba(255,255,255,.08)}
.chip-link:hover{background:rgba(255,255,255,.18)}

.listing .meta .made,.facts .ok{color:var(--done)}
.facts .ok{display:inline-flex;align-items:center;gap:6px}

.chapters a{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.22);text-decoration:none}
.chapters a:hover{background:rgba(255,255,255,.1)}
.crumbs a svg{opacity:.85}

function stepLightbox(d){ if (lb) openLightbox(lb.l, (lb.i + d + lb.l.photos.length) % lb.l.photos.length); }
function closeLightbox(){ const el = document.getElementById("lightbox"); if (el) el.hidden = true; document.body.style.overflow = ""; const o = lb && lb.opener; lb = null; if (o && document.contains(o)) o.focus(); }
